{% extends "base.html" %}

{% block title %}Teacher Access - ROYAL BEES SCHOOLS{% endblock %}

{% block content %}
<div class="container py-5 my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0" style="border-radius: 20px; border-top: 8px solid var(--primary-green) !important;">
                <div class="card-body p-5 text-center">
                    
                    <div style="width: 80px; height: 80px; background-color: rgba(20, 122, 70, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                        <i class="fas fa-lock" style="font-size: 2rem; color: var(--primary-green);"></i>
                    </div>

                    <h3 style="color: var(--primary-green); font-weight: 800;">Restricted Area</h3>
                    <p class="text-muted mb-4">Please enter the administrative password to access the Teacher Portal.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group mb-4 text-left">
                            <label for="admin_password" class="font-weight-bold text-dark">Portal Password</label>
                            <input type="password" name="admin_password" id="admin_password" class="form-control form-control-lg" placeholder="••••••••" style="border-radius: 10px; background-color: #f8f9fa;" required>
                        </div>
                        <button type="submit" class="btn btn-lg btn-block text-white" style="background-color: var(--primary-green); border-radius: 10px; font-weight: bold;">
                            Unlock Portal <i class="fas fa-unlock-alt ml-2"></i>
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block content %}
<div style="max-width: 600px; margin: 50px auto; text-align: center; padding: 30px;">
    <h2 style="color: #dc3545;">Payment Failed</h2>
    {% if error %}
        <p>{{ error }}</p>
    {% elif reason %}
        <p>{{ reason }}</p>
    {% else %}
        <p>We couldn't confirm your transaction. Please try again or contact the school office.</p>
    {% endif %}
    <a href="{% url 'results:pay_fees' %}" class="btn btn-warning">Try Again</a>
</div>
{% endblock %}
